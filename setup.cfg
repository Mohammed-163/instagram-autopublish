[metadata]
name = autonomous-ai
version = 1.0.0
description = Autonomous AI System — All Phases Integrated

[options]
python_requires = >=3.11
packages = find:

[options.packages.find]
include =
    shared*
    bridges*
    phase5_6*
    phase7_observation*
    phase8_learning*
    phase9_coverage*
    phase10_intelligence*

[tool:pytest]
testpaths = tests phase5_6/tests
addopts = -q --tb=short
pythonpath = .
