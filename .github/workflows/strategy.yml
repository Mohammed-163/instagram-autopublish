name: Strategy — Monthly Planning

on:
  schedule:
    - cron: "0 1 1 * *"   # 04:00 Asia/Baghdad, 1st of month
  workflow_dispatch:

concurrency:
  group: strategy
  cancel-in-progress: false

jobs:
  strategy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt google-genai --quiet
      - name: Run monthly_task.py
        env:
          GOOGLE_SHEET_ID:                 ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_DRIVE_FOLDER_ID:          ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_OAUTH_TOKEN_JSON_B64:     ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_B64 }}
          GEMINI_API_KEY_1:                ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2:                ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3:                ${{ secrets.GEMINI_API_KEY_3 }}
          PIXABAY_API_KEY:                 ${{ secrets.PIXABAY_API_KEY }}
          FB_APP_ID:                       ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET:                   ${{ secrets.FB_APP_SECRET }}
          IG_ACCESS_TOKEN:                 ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN:              ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:                ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python phase5_6/scripts/monthly_task.py
      - name: Notify failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: "🔴 Monthly Strategy FAILED\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
