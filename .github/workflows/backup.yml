name: Weekly Backup

on:
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt --quiet

      - name: Back up Sheets and databases to private Drive
        env:
          GOOGLE_SHEET_ID:                  ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64:  ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_OAUTH_TOKEN_JSON_B64:      ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_B64 }}
          LEARNING_LAYER_DATABASE_URL:     ${{ secrets.DATABASE_URL }}
          KCL_DATABASE_URL:                ${{ secrets.KCL_DATABASE_URL }}
          P10_DATABASE_URL:                ${{ secrets.P10_DATABASE_URL }}
        run: python -m phase5_6.scripts.weekly_backup

      - name: Notify failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: "🔴 Backup FAILED\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
