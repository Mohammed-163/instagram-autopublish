name: Fetch Instagram Insights

on:
  schedule:
    - cron: "*/15 * * * *"   # Poll due milestones every 15 minutes (GitHub may delay scheduled runs)
  workflow_dispatch:

concurrency:
  group: instagram-insight-snapshots
  cancel-in-progress: false

jobs:
  fetch-insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Fetch insights and publish observations
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LEARNING_LAYER_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KCL_DATABASE_URL: ${{ secrets.KCL_DATABASE_URL }}
          P10_DATABASE_URL: ${{ secrets.P10_DATABASE_URL }}
        run: python phase5_6/scripts/fetch_insights.py
