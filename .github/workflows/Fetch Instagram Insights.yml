name: Fetch Instagram Insights

on:
  repository_dispatch:
    types: [run-instagram-insights]
  workflow_dispatch:

concurrency:
  group: instagram-insight-snapshots
  cancel-in-progress: false

jobs:
  fetch-insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Fetch insights and publish observations
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          LEARNING_LAYER_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m phase5_6.scripts.fetch_insights
