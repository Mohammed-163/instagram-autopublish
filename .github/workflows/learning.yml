name: Learning Infrastructure Check (Manual)

on:
  workflow_dispatch:

concurrency:
  group: learning-check
  cancel-in-progress: false

jobs:
  learning-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt --quiet
      - name: Bootstrap configured learning databases without synthetic observations
        env:
          DATABASE_URL:                ${{ secrets.DATABASE_URL }}
          SUPABASE_URL:                ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY:         ${{ secrets.SUPABASE_SECRET_KEY }}
          LEARNING_LAYER_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KCL_DATABASE_URL:            ${{ secrets.KCL_DATABASE_URL }}
          P10_DATABASE_URL:            ${{ secrets.P10_DATABASE_URL }}
        run: python -u main.py
      - name: Notify failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: "🔴 Learning infrastructure check failed\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
