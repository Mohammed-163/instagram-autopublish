name: Learning Layer Cycle

on:
  schedule:
    - cron: "0 0 * * *"   # 03:00 Asia/Baghdad
  workflow_dispatch:
    inputs:
      run_pipeline_test:
        description: "Run the manual Phase 6 → Phase 7 → Phase 8 pipeline test"
        required: true
        default: false
        type: boolean
      also_run_full_pipeline:
        description: "Run Phase 8-10 pipeline even when manual test also runs"
        type: boolean
        default: false
        required: false

concurrency:
  group: learning
  cancel-in-progress: false

jobs:
  learning:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt --quiet
      - name: Run full AI pipeline (Phases 8-10)
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.run_pipeline_test != true || inputs.also_run_full_pipeline == true) }}
        env:
          DATABASE_URL:                ${{ secrets.DATABASE_URL }}
          SUPABASE_URL:                ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY:         ${{ secrets.SUPABASE_SECRET_KEY }}
          LEARNING_LAYER_DATABASE_URL: ${{ secrets.LEARNING_LAYER_DATABASE_URL }}
          KCL_DATABASE_URL:            ${{ secrets.KCL_DATABASE_URL }}
          P10_DATABASE_URL:            ${{ secrets.P10_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN:          ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:            ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u main.py --test-event-flow
      - name: Run manual full pipeline test (Phases 6-8)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_pipeline_test == true }}
        env:
          DATABASE_URL:                ${{ secrets.DATABASE_URL }}
          SUPABASE_URL:                ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY:         ${{ secrets.SUPABASE_SECRET_KEY }}
          LEARNING_LAYER_DATABASE_URL: ${{ secrets.LEARNING_LAYER_DATABASE_URL }}
          KCL_DATABASE_URL:            ${{ secrets.KCL_DATABASE_URL }}
          P10_DATABASE_URL:            ${{ secrets.P10_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN:          ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:            ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/test_full_pipeline_manual.py
      - name: Notify failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: "🔴 Learning Layer FAILED\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
