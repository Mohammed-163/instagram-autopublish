name: Learning Layer Cycle

on:
  schedule:
    - cron: "0 0 * * *"   # 03:00 Asia/Baghdad
  workflow_dispatch:

concurrency:
  group: learning
  cancel-in-progress: false

jobs:
  learning:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt --quiet
      - name: Run full AI pipeline (Phases 8-10)
        env:
          DATABASE_URL:                ${{ secrets.DATABASE_URL }}
          SUPABASE_URL:                ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY:         ${{ secrets.SUPABASE_SECRET_KEY }}
          LEARNING_LAYER_DATABASE_URL: ${{ secrets.LEARNING_LAYER_DATABASE_URL }}
          KCL_DATABASE_URL:            ${{ secrets.KCL_DATABASE_URL }}
          P10_DATABASE_URL:            ${{ secrets.P10_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN:          ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:            ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
      - name: Notify failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: "🔴 Learning Layer FAILED\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
